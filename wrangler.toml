# Cloudflare Pages: publica public/ e as funções de functions/ a cada push na main.
# As funções servem o radar (/api/radar, público, só leitura) e a edição do radar (/admin/,
# atrás do Cloudflare Access). Nenhuma delas recebe dado de visitante: a carteira de quem usa
# o site continua só no navegador.
name = "ativos-letabuild"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
# Cloudflare Access: o login de /admin/ é o mesmo app da carteira privada (mesmo público/AUD).
# O e-mail do dono fica em segredo do Pages (EMAIL_DONO), não aqui: o repositório é público.
ACCESS_TEAM = "https://green-hill-f178.cloudflareaccess.com"
ACCESS_AUD = "b31d9dc52781f538359f66fa6fe7548b29b305cb59757af2c740c04729f70c0d"

[[d1_databases]]
binding = "DB"
database_name = "ativos-radar"
database_id = "f63f3479-2d1e-468d-ada0-4f67916ca7e0"
